apiVersion: v1
kind: Pod

metadata:
  name: multi-container-pod

spec:

  volumes:
  - name: shared-volume
    emptyDir: {}

  containers:

  - name: nginx-container

    image: nginx

    volumeMounts:
    - name: shared-volume
      mountPath: /usr/share/nginx/html

  - name: busybox-container

    image: busybox

    command:
    - sh
    - -c
    - while true; do ls /shared; sleep 5; done

    volumeMounts:
    - name: shared-volume
      mountPath: /shared