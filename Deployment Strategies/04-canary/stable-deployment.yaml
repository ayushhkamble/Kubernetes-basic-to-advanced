apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-stable
  labels:
    app: my-app
    track: stable
spec:
  replicas: 9
  selector:
    matchLabels:
      app: my-app
      track: stable
  template:
    metadata:
      labels:
        app: my-app
        track: stable
    spec:
      containers:
        - name: app
          image: nginx:1.24
          ports:
            - containerPort: 80